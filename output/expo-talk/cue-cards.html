    [22, "넘김", [

      `오늘 보신 작품은 <em>렛츠코딩 부스 ${BOOTH}번</em>에서 직접 만들어 보실 수 있습니다. 즐겁게, 렛츠코딩 라운지와 바이브 하세요. 감사합니다.`
    ]]
  ]]
];

const syllables = (html) => (html.replace(/<[^>]+>/g, "").match(/[가-힣]/g) || []).length;
const clock = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
let elapsed = 0;
const main = document.getElementById("cards");
let page;
CARDS.forEach(([title, slides], i) => {
  if (i % 2 === 0) { page = document.createElement("section"); page.className = "page"; main.append(page); }
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `<div class="head"><h2>${title}</h2><span class="no">카드 ${String(i + 1).padStart(2, "0")} / ${CARDS.length}</span></div>`;
  for (const [no, how, paras, min = 0] of slides) {
    const spoken = paras.filter((p) => !p.startsWith("※") && !p.startsWith("!")).reduce((n, p) => n + syllables(p), 0);
    const start = elapsed;
    elapsed += Math.max(min, spoken / RATE * 60);
    const div = document.createElement("div");
    div.className = "slide";
    div.innerHTML = `<div class="meta"><b>${String(no).padStart(2, "0")}</b><span>${how}</span><time>${clock(start)}</time></div>` +
      `<div class="say">${paras.map((p) => p.startsWith("※") ? `<p class="note">${p}</p>` : p.startsWith("!") ? `<p class="cue">${p.slice(1).trim()}</p>` : `<p>${p}</p>`).join("")}</div>`;
    card.append(div);
  }
  page.append(card);
});
// 목표 시각: 카드 글만 읽은 시간(elapsed)을 TARGET에 맞춰 늘인다
const scale = TARGET / elapsed;
main.querySelectorAll("time").forEach((t) => { const [m, s] = t.textContent.split(":").map(Number); t.textContent = "목표 " + clock((m * 60 + s) * scale); });
// 마지막 카드 아래: 예상 총 시간
const last = main.querySelector(".page:last-child .card:last-child");
last.insertAdjacentHTML("beforeend", `<div class="foot"><span>목표 ${clock(TARGET)} · 제한 ${LIMIT}</span><span>카드 글만 읽으면 약 ${clock(elapsed)}(분당 ${RATE}음절)</span></div>`);
// 넘치는 카드는 빨간 테두리로 표시한다(인쇄 전에 확인)
requestAnimationFrame(() => document.querySelectorAll(".card").forEach((c) => {
  if (c.scrollHeight > c.clientHeight + 1) { c.classList.add("over"); console.warn("넘침:", c.querySelector("h2").textContent); }
}));
document.title = "박람회 발표 대본 카드";
</script>
</body>
</html>
