<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>렛츠코딩 라운지 &amp; 스튜디오 · 웨이브 간판</title>
<link rel="stylesheet" href="../../prototypes/brochure/fonts.css">
<style>
@font-face{font-family:Jua;src:url("../../public/fonts/jua/signboard.ttf");font-weight:400}
*{box-sizing:border-box}
body{margin:0;padding:clamp(8px,3vw,40px);background:#e7e8eb;font-family:"Pretendard Variable",Pretendard,sans-serif}
.sign{max-width:1400px;aspect-ratio:4/1;margin:auto;container-type:inline-size;display:grid;align-content:center;justify-items:center;color:white;background:#3048ed url("assets/signboard-wave.png") center/cover no-repeat;text-align:center;print-color-adjust:exact}
h1,p{margin:0;white-space:nowrap}
h1{font:400 11.2cqw/1 Jua,sans-serif;letter-spacing:-.035em;text-shadow:0 .3cqw 1.4cqw #19257966}
.products{padding:.2cqw 2.9cqw .32cqw;border:.25cqw solid white;border-radius:99px;font-size:3cqw;font-weight:720;line-height:1.12}
.desc{display:flex;align-items:center;gap:1.1cqw;margin-top:1.1cqw;font-size:2.25cqw;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.desc::before,.desc::after{content:"";width:4.5cqw;height:.13cqw;background:currentColor}
@media print{@page{size:1200px 300px;margin:0}body{padding:0}.sign{max-width:none}}
</style>
</head>
<body>
<main class="sign">
  <h1>렛츠코딩</h1>
  <p class="products">라운지 &amp; 스튜디오</p>
  <p class="desc">안전한 AI 바이브코딩 교육 플랫폼</p>
</main>
</body>
</html>
