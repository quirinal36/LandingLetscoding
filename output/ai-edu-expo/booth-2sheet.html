<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>렛츠코딩 부스 벽당 2장 시안 · AI EDU Expo</title>
<link rel="stylesheet" href="../../prototypes/brochure/fonts.css">
<style>
/*
  AI EDU Expo 조립부스(바닥 3,000×3,000mm, 벽 높이 2,500mm) 안쪽 벽 시안 — 벽 한 면을 2장으로 나누는 안.
  2026-11-16 사용자 요청: 벽 두 면(뒷벽·옆벽)을 각각 2장으로 출력한다. 2026-11-17 장당 1,470×2,300mm로 바꿨다(이전 1,425×2,380 가정).
  실제 시트 크기가 다르면 --pw 와 아래 좌표를 고친다. 이음선은 x=1,470 한 곳.
    · 뒷벽 B1·B2: 렛츠코딩 스튜디오 / 옆벽 S1·S2: 렛츠코딩 라운지
  뒷벽에는 두 장을 잇는 사선 배경과 학생 작품을, 옆벽에는 표지 일러스트를 배치한다.
  바닥에서 650mm(y 1,650 이하)는 사람·가구에 가리므로 핵심 문구를 두지 않는다.
  ?panel=B1 처럼 열면 그 패널 한 장만 실제 비율로 표시한다(출력용).
*/
:root{
  --pw:1470; --ph:2300; --gap:12;
  --night:#0a0920; --satin:#17144a; --mist:#c9c2ff;
  --violet:#7439f1; --indigo:#3c34c5; --coral:#fc6a77; --pearl:#f3f1fb;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 24px 60px;background:#d9dce6;color:#1b2333;font-family:var(--font);word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.note{max-width:1400px;margin:0 auto 14px;font-size:14px;color:#4b5570;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.note label{cursor:pointer;user-select:none}
.note a{color:inherit;text-underline-offset:3px}
h2.wall-title{max-width:1400px;margin:34px auto 10px;font-size:16px;font-weight:700;color:#2a3150}
h2.wall-title span{font-weight:400;color:#55607a;margin-left:10px}

/* ── 벽: 패널 2장 + 이음선 1개 ── */
/* 1470 : 12 : 1470 — 이음선은 화면 확인용으로 벌려 보여 준다 */
.wall{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1470fr 12fr 1470fr;
  background:#2a2a30;padding:0;box-shadow:0 14px 50px rgba(10,9,32,.35)}
.post{background:linear-gradient(90deg,#1c1c22,#3a3a44 50%,#1c1c22)}
.panel{position:relative;aspect-ratio:var(--pw)/var(--ph);overflow:hidden;container-type:inline-size}
.panel .tag{position:absolute;left:6px;top:6px;z-index:5;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;display:none}
body.guides .panel .tag{display:block}
.panel .floor{position:absolute;left:0;right:0;bottom:0;height:calc(650 / var(--ph) * 100%);z-index:4;display:none;
  background:repeating-linear-gradient(135deg,rgba(252,106,119,.16) 0 8px,transparent 8px 16px);border-top:1px dashed rgba(252,106,119,.8)}
body.guides .panel .floor{display:block}

/* 패널 안의 아트: 2,940mm 폭 장면을 패널 위치만큼 옮겨서 보여 준다 */
.scene{position:absolute;top:0;height:100%;width:200%;left:calc(var(--i) * -100%);container-type:inline-size}
.scene > *{--u:calc(100cqw / 2940)}

.scene{background:#0f1150 url("assets/booth-print/lounge.jpg") center/cover no-repeat}

@font-face{font-family:"Studio Black Han";src:url("../../public/fonts/black-han-sans/studio-title.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Studio Chiron";src:url("../../public/fonts/chiron-goround-tc/studio-copy.woff2") format("woff2");font-weight:600}
.wall-copy{position:absolute;left:5%;top:12%;width:43%;color:#253154;font:600 calc(76 * var(--u))/1.3 "Studio Chiron",var(--font)}
.wall-copy p,.wall-copy h1{margin:0}
.wall-copy h1{margin:.15em 0 .3em;font:400 calc(156 * var(--u))/1.14 "Studio Black Han",var(--font);letter-spacing:-.032em}
.wall-copy .features{display:flex;align-items:center;gap:.95em;list-style:none;margin:0;padding:0;font-size:calc(48 * var(--u));line-height:1.45}
.wall-copy .features li{display:flex;align-items:center;gap:.35em;white-space:nowrap}
.wall-copy .features img{width:1.35em;height:1.35em}

@font-face{font-family:"Lounge Black Han";src:url("../../public/fonts/black-han-sans/expo-title.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Lounge Chiron";src:url("../../public/fonts/chiron-goround-tc/expo-cover.woff2") format("woff2");font-weight:550 800}
.side-wall .wall-copy{font-family:"Lounge Chiron",var(--font)}
.side-wall .wall-copy h1{font-family:"Lounge Black Han",var(--font)}
.side-wall .features img[src$="/sharing.png"]{width:1.08em;height:1.08em}

.back-wall .scene{background:url("assets/booth-print/studio.svg") center/100% 100%}
.back-wall{--studio-inset:14.5%}
.back-wall .wall-copy{left:6.75%;width:37.25%;top:var(--studio-inset);color:#faf8ff}
.back-wall .wall-copy>p{color:#ffadb9}
.back-wall .features{font-size:calc(42 * var(--u));gap:.75em}
.back-wall .features img{filter:brightness(0) invert(85%)}
.projects{position:absolute;bottom:var(--studio-inset);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.6cqw;color:#f8f6ff}
.projects-left{left:13.5%;right:12%}
.projects-right{left:10%;right:14%}
.projects figure{margin:0;overflow:hidden;background:#1d1b34}
.projects figure>img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.projects figcaption{padding:2.3cqw 3.2cqw 3.1cqw}
.projects figcaption>*{display:block}
.projects small{color:#ffc0ca;font-weight:650;font-size:1.75cqw;line-height:1.2}
.projects strong{font-size:3.05cqw;letter-spacing:-.045em;line-height:1.22;margin:.24em 0 .18em}
.projects .project-meta{display:flex;align-items:center;gap:.8cqw}
.project-meta small+small{display:flex;align-items:center;gap:.8cqw;white-space:nowrap}
.project-meta small+small::before{content:"";width:1px;height:.8em;background:currentColor;opacity:.5}
.projects span{font-size:2.05cqw;color:#e1ddec;line-height:1.3}
/* ── 한 장 출력 모드 ── */
body.single{padding:0;background:#000}
body.single .note,body.single h2.wall-title,body.single .post{display:none}
body.single .wall{display:block;max-width:none;box-shadow:none;background:none}
body.single .panel{display:none;width:100vw;max-width:calc(100vh * 1470 / 2300)}
body.single .panel.on{display:block}
@media print{
  @page{size:1470mm 2300mm;margin:0}
  body.single .panel.on{width:1470mm;max-width:none}
}
</style>
</head>
<body>
<p class="note">AI EDU Expo 조립부스 시안 · 벽당 2장 · 장당 1,470×2,300mm · 회색 선은 장 사이 이음선
  <a href="info-desk.html">인포데스크 정면 950×660mm ↗</a>
  <label><input type="checkbox" onchange="document.body.classList.toggle('guides',this.checked)"> 패널 번호·가림 구역(바닥 650mm) 표시</label></p>

<h2 class="wall-title">뒷벽 B1–B2<span>렛츠코딩 스튜디오 · AI 바이브코딩</span></h2>
<div class="wall back-wall" data-wall="B"></div>

<h2 class="wall-title">옆벽 S1–S2<span>렛츠코딩 라운지 · 우리들의 창작공간</span></h2>
<div class="wall side-wall" data-wall="S"></div>

<template id="studio-copy">
  <header class="wall-copy"><p>AI 바이브코딩</p><h1>렛츠코딩 스튜디오</h1><ul class="features">
    <li><img src="assets/booth-print/shield.png" alt="">안전한 AI 활용</li>
    <li><img src="assets/booth-print/link.png" alt="">다양한 기능 연동</li>
    <li><img src="assets/booth-print/coding.png" alt="">게임 · 앱 제작</li>
  </ul></header>
</template>
<template id="lounge-copy">
  <header class="wall-copy"><p>우리들의 창작공간</p><h1>렛츠코딩 라운지</h1><ul class="features">
    <li><img src="assets/booth-print/coding.png" alt="">AI 코딩</li>
    <li><img src="assets/booth-print/sharing.png" alt="">작품 공유</li>
    <li><img src="assets/booth-print/feedback.png" alt="">상호 피드백</li>
    <li><img src="assets/booth-print/investment.png" alt="">모의투자</li>
  </ul></header>
</template>
<template id="projects-left">
  <div class="projects projects-left">
    <figure><img src="assets/booth-print/englsihword.jpg" alt=""><figcaption><div class="project-meta"><small>영어</small><small>초6 제작</small></div><strong>영어의 전설</strong><span>영어 단어 암기를 돕는 RPG 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/storygame.jpg" alt=""><figcaption><div class="project-meta"><small>사회</small><small>초5 제작</small></div><strong>태안: 서해안의 기적</strong><span>태안 기름유출 사고 스토리 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/independence-fund.jpg" alt=""><figcaption><div class="project-meta"><small>역사</small><small>초3 제작</small></div><strong>독립자금을 전달하세요</strong><span>독립운동가에게 자금을 전하는 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/elemental-snake.jpg" alt=""><figcaption><div class="project-meta"><small>과학</small><small>초4 제작</small></div><strong>엘리멘탈 스네이크</strong><span>원소 기호를 순서대로 먹는 게임</span></figcaption></figure>
  </div>
</template>
<template id="projects-right">
  <div class="projects projects-right">
    <figure><img src="assets/booth-print/sniper-fire.jpg" alt=""><figcaption><div class="project-meta"><small>역사</small><small>초6 제작</small></div><strong>저격! 발사!</strong><span>워털루 전쟁 배경의 RPG 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/type-storm.jpg" alt=""><figcaption><div class="project-meta"><small>타자</small><small>초6 제작</small></div><strong>TYPE STORM</strong><span>긴장감 넘치는 타자연습 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/mini-sudoku.jpg" alt=""><figcaption><div class="project-meta"><small>수학</small><small>초2 제작</small></div><strong>미니 스도쿠</strong><span>4x4 칸에 1~4를 채우는 논리 퍼즐</span></figcaption></figure>
    <figure><img src="assets/booth-print/monster-egg-lab.jpg" alt=""><figcaption><div class="project-meta"><small>수학</small><small>초3 제작</small></div><strong>몬스터 알 연구소</strong><span>확률을 시각화한 랜덤 부화 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/keycap-castle.jpg" alt=""><figcaption><div class="project-meta"><small>게임</small><small>7세 제작</small></div><strong>키캡캐슬</strong><span>키캡을 밟고 올라가는 점프맵 게임</span></figcaption></figure>
    <figure><img src="assets/booth-print/dust-removal.jpg" alt=""><figcaption><div class="project-meta"><small>수학</small><small>7세 제작</small></div><strong>먼지를 없애라</strong><span>한붓그리기로 먼지를 먹는 청소 게임</span></figcaption></figure>
  </div>
</template>
<script>
const only = new URLSearchParams(location.search).get('panel');
if (only) document.body.classList.add('single');
for (const wall of document.querySelectorAll('.wall')) {
  const w = wall.dataset.wall;
  for (let i = 0; i < 2; i++) {
    if (i) wall.insertAdjacentHTML('beforeend', '<div class="post"></div>');
    const id = w + (i + 1);
    const p = document.createElement('div');
    p.className = 'panel ' + (w === 'B' ? 'back-panel' : 'side') + (only === id ? ' on' : '');
    p.innerHTML = '<div class="scene" style="--i:' + i + '"></div><span class="tag">' + id + '</span><div class="floor"></div>';
    if (i === 0) {
      const copy = document.getElementById(w === 'B' ? 'studio-copy' : 'lounge-copy');
      p.querySelector('.scene').append(copy.content.cloneNode(true));
    }
    if (w === 'B') {
      const gallery = document.getElementById(i === 0 ? 'projects-left' : 'projects-right');
      p.append(gallery.content.cloneNode(true));
    }
    wall.append(p);
  }
}
</script>
</body>
</html>
