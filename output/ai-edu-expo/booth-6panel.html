<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>렛츠코딩 부스 6패널 시안 · AI EDU Expo</title>
<link rel="stylesheet" href="../../prototypes/brochure/fonts.css">
<style>
/*
  AI EDU Expo 조립부스(바닥 3,000×3,000mm, 벽 높이 2,500mm) 안쪽 벽 6패널 시안.
  매뉴얼 12쪽: 벽 한 면은 950×2,380mm 출력물 3장. 2026-11-16 담당 직원 확인으로 6패널(벽 두 면)만 출력한다.
    · 뒷벽 B1~B3: backwall.html 의 미드나이트 톤과 캐치프레이즈 「체험을 넘어, 내 작품으로」
    · 옆벽 S1~S3: assets/lounge-studio-wide.png 한 장을 세 장에 이어 붙인다
    · 나머지 옆벽 자리(벽 없음)에는 65인치 TV를 둔다
  좌표 단위는 mm. 아트 좌표는 패널 세 장을 이어 붙인 2,850×2,380 공간이며, 화면에서는 기둥 자리(--gap)를 벌려 보여 준다.
  글자는 패널 경계(x=950, 1,900)를 넘지 않는다. 헤드라인은 단어 사이 띄어쓰기를 기둥 자리에 맞췄다.
  바닥에서 650mm(y 1,730 이하)는 사람·가구에 가리므로 핵심 문구를 두지 않는다.
  ?panel=B1 처럼 열면 그 패널 한 장만 실제 비율로 표시한다(출력용).
*/
:root{
  --pw:950; --ph:2380; --gap:50;
  --night:#0a0920; --satin:#17144a; --mist:#c9c2ff;
  --violet:#7439f1; --indigo:#3c34c5; --coral:#fc6a77; --pearl:#f3f1fb;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 24px 60px;background:#d9dce6;color:#1b2333;font-family:var(--font);word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.note{max-width:1400px;margin:0 auto 14px;font-size:14px;color:#4b5570;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.note label{cursor:pointer;user-select:none}
h2.wall-title{max-width:1400px;margin:34px auto 10px;font-size:16px;font-weight:700;color:#2a3150}
h2.wall-title span{font-weight:400;color:#55607a;margin-left:10px}

/* ── 벽: 패널 3장 + 기둥 2개 ── */
/* 950 : 50 : 950 : 50 : 950 — 기둥 폭 50mm는 가정 */
.wall{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:950fr 50fr 950fr 50fr 950fr;
  background:#2a2a30;padding:0;box-shadow:0 14px 50px rgba(10,9,32,.35)}
.post{background:linear-gradient(90deg,#1c1c22,#3a3a44 50%,#1c1c22)}
.panel{position:relative;aspect-ratio:var(--pw)/var(--ph);overflow:hidden;container-type:inline-size}
.panel .tag{position:absolute;left:6px;top:6px;z-index:5;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;display:none}
body.guides .panel .tag{display:block}
.panel .floor{position:absolute;left:0;right:0;bottom:0;height:calc(650 / var(--ph) * 100%);z-index:4;display:none;
  background:repeating-linear-gradient(135deg,rgba(252,106,119,.16) 0 8px,transparent 8px 16px);border-top:1px dashed rgba(252,106,119,.8)}
body.guides .panel .floor{display:block}

/* 패널 안의 아트: 2,850mm 폭 장면을 패널 위치만큼 옮겨서 보여 준다 */
.scene{position:absolute;top:0;height:100%;width:300%;left:calc(var(--i) * -100%);container-type:inline-size}
.scene > *{--u:calc(100cqw / 2850)}

/* ── 뒷벽(B) ── */
.back{background:
    radial-gradient(40% 50% at 4% 96%, rgba(116,57,241,.45), transparent 70%),
    radial-gradient(40% 45% at 97% 4%, rgba(252,106,119,.30), transparent 70%),
    var(--night)}
.band{position:absolute;inset:0;clip-path:polygon(60% 0,100% 0,100% 100%,36% 100%);
  background:
    linear-gradient(150deg, rgba(255,255,255,.06) 0%, transparent 40%, transparent 60%, rgba(255,255,255,.04) 100%),
    radial-gradient(45% 60% at 70% 45%, rgba(60,52,197,.5), transparent 75%),
    var(--satin)}
.t{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));margin:0;white-space:nowrap;color:var(--pearl)}
.head{font-size:calc(215 * var(--u));font-weight:800;line-height:1.1;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ffffff 0%,#f6f3ff 55%,#d4ceef 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(6 * var(--u)) calc(30 * var(--u)) rgba(10,9,32,.6))}
.head em{font-style:normal;background:linear-gradient(90deg,#ffb3b9 0%,var(--coral) 55%,#e58fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:calc(76 * var(--u));font-weight:500;line-height:1.42;color:rgba(243,241,251,.95)}
.lead b{font-weight:700;color:#fff}
.rule{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));width:calc(var(--s) * var(--u));height:calc(8 * var(--u));border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--violet))}

.point{position:absolute;left:calc(var(--x) * var(--u));top:calc(1330 * var(--u));width:calc(770 * var(--u));height:calc(360 * var(--u));
  padding:calc(50 * var(--u)) calc(56 * var(--u));border-radius:calc(34 * var(--u));
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:calc(2 * var(--u)) solid rgba(201,194,255,.30);
  box-shadow:0 calc(16 * var(--u)) calc(50 * var(--u)) rgba(5,4,20,.45), inset 0 calc(2 * var(--u)) 0 rgba(255,255,255,.12)}
.point .who{display:block;font-size:calc(38 * var(--u));font-weight:600;letter-spacing:.22em;color:var(--mist);margin-bottom:calc(22 * var(--u))}
.point .who::before{content:"";display:inline-block;width:calc(18 * var(--u));height:calc(18 * var(--u));border-radius:50%;background:var(--coral);box-shadow:0 0 calc(14 * var(--u)) var(--coral);margin-right:calc(18 * var(--u));vertical-align:.08em}
.point .what{display:block;font-size:calc(64 * var(--u));font-weight:700;line-height:1.3;color:var(--pearl)}

.label{font-size:calc(34 * var(--u));font-weight:600;letter-spacing:.3em;color:var(--mist)}
.label b{font-weight:400;letter-spacing:.06em;color:rgba(243,241,251,.62);margin-left:calc(16 * var(--u))}
.card{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));width:calc(var(--s) * var(--u));margin:0;padding:calc(10 * var(--u));border-radius:calc(26 * var(--u));
  background:rgba(255,255,255,.10);border:calc(2 * var(--u)) solid rgba(201,194,255,.30);
  box-shadow:0 calc(30 * var(--u)) calc(70 * var(--u)) rgba(5,4,20,.55);transform:rotate(var(--r,0deg))}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:calc(18 * var(--u)) calc(18 * var(--u)) 0 0}
.card figcaption{display:flex;align-items:center;justify-content:space-between;gap:calc(12 * var(--u));
  padding:calc(16 * var(--u)) calc(22 * var(--u));border-radius:0 0 calc(18 * var(--u)) calc(18 * var(--u));
  background:var(--night);color:var(--pearl);font-size:calc(36 * var(--u));font-weight:600;line-height:1.1;white-space:nowrap}
.card figcaption svg{flex:none;width:1.05em;height:1.05em;fill:var(--coral)}
.piece{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));width:calc(var(--s) * var(--u));height:auto;transform:rotate(var(--r,0deg));filter:drop-shadow(0 0 calc(24 * var(--u)) var(--glow))}

.foot{font-size:calc(40 * var(--u));font-weight:400;color:rgba(243,241,251,.75)}
.brand{position:absolute;left:calc(110 * var(--u));top:calc(2120 * var(--u));display:flex;align-items:center;gap:calc(10 * var(--u))}
.brand img{display:block;width:calc(150 * var(--u));height:auto;mix-blend-mode:screen}
.brand strong{font-size:calc(64 * var(--u));font-weight:700;letter-spacing:.04em;line-height:1;white-space:nowrap;color:var(--pearl)}
.url{font-size:calc(46 * var(--u));font-weight:500;letter-spacing:.05em;color:var(--mist)}

/* ── 옆벽(S): 이미지 한 장을 세 장에 나눠 붙인다 ── */
.side .scene{background:#0f1150 url("assets/lounge-studio-wide.png") center/cover no-repeat}

/* ── 한 장 출력 모드 ── */
body.single{padding:0;background:#000}
body.single .note,body.single h2.wall-title,body.single .post{display:none}
body.single .wall{display:block;max-width:none;box-shadow:none;background:none}
body.single .panel{display:none;width:100vw;max-width:calc(100vh * 950 / 2380)}
body.single .panel.on{display:block}
@media print{
  @page{size:950mm 2380mm;margin:0}
  body.single .panel.on{width:950mm;max-width:none}
}
</style>
</head>
<body>
<p class="note">AI EDU Expo 조립부스 6패널 시안 v1 · 패널 950×2,380mm × 6장 · 회색 띠는 패널 사이 기둥 자리(시공 참고, 실제 폭은 현장 확인)
  <label><input type="checkbox" onchange="document.body.classList.toggle('guides',this.checked)"> 패널 번호·가림 구역(바닥 650mm) 표시</label></p>

<h2 class="wall-title">뒷벽 B1–B3<span>캐치프레이즈 · 통로 정면</span></h2>
<div class="wall back-wall" data-wall="B"></div>

<h2 class="wall-title">옆벽 S1–S3<span>렛츠코딩 스튜디오 × 라운지 이미지 · 반대쪽 옆은 벽 없이 TV</span></h2>
<div class="wall side-wall" data-wall="S"></div>

<!-- 뒷벽 아트 (2,850 × 2,380mm 좌표) -->
<template id="back-art">
  <div class="band"></div>

  <!-- 헤드라인: 1줄은 B1·B2, 2줄은 B2·B3. 단어 사이가 기둥 자리 -->
  <h1 class="t head" style="--x:150;--y:190">체험을</h1>
  <h1 class="t head" style="--x:1040;--y:190">넘어,</h1>
  <h1 class="t head" style="--x:1672;--y:470"><em>내</em></h1>
  <h1 class="t head" style="--x:1940;--y:470"><em>작품</em>으로</h1>

  <!-- B1: 설명 -->
  <span class="rule" style="--x:155;--y:560;--s:180"></span>
  <p class="t lead" style="--x:150;--y:620">교구 없이,<br><b>학생이</b> AI와 함께<br>자기 웹페이지와<br>게임을 만드는 수업</p>

  <!-- B2·B3: 라운지 공개 작품 -->
  <p class="t label" style="--x:1040;--y:820">LOUNGE<b>학생이 만든 작품</b></p>
  <figure class="card" style="--x:1050;--y:890;--s:620;--r:-3deg">
    <img src="../../public/landing/works/english-legend.webp" alt="">
    <figcaption>영어의 전설<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.6 1.9 4.5 5.6 4.1c2-.2 3.8.8 4.9 2.3L12 8.3l1.5-1.9c1.1-1.5 2.9-2.5 4.9-2.3 3.7.4 5.3 4.5 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg></figcaption>
  </figure>
  <figure class="card" style="--x:2040;--y:860;--s:620;--r:3deg">
    <img src="../../public/landing/works/bezierider.webp" alt="">
    <figcaption>베지에 라이더<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.2C.3 8.6 1.9 4.5 5.6 4.1c2-.2 3.8.8 4.9 2.3L12 8.3l1.5-1.9c1.1-1.5 2.9-2.5 4.9-2.3 3.7.4 5.3 4.5 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg></figcaption>
  </figure>
  <svg class="piece" style="--x:1745;--y:1150;--s:100;--r:-16deg;--glow:rgba(116,57,241,.8)" viewBox="0 -5 105 105" aria-hidden="true"><path fill="#7439f1" d="M0,20 H30 A14.14,14.14 0 1 1 50,20 H80 V50 A14.14,14.14 0 1 1 80,70 V100 H50 A14.14,14.14 0 1 0 30,100 H0 V70 A14.14,14.14 0 1 0 0,50 Z"/></svg>
  <svg class="piece" style="--x:2700;--y:770;--s:80;--r:32deg;--glow:rgba(252,106,119,.8)" viewBox="0 -5 105 105" aria-hidden="true"><path fill="#fc6a77" d="M0,20 H30 A14.14,14.14 0 1 1 50,20 H80 V50 A14.14,14.14 0 1 1 80,70 V100 H50 A14.14,14.14 0 1 0 30,100 H0 V70 A14.14,14.14 0 1 0 0,50 Z"/></svg>

  <!-- 요점: 패널마다 하나 -->
  <div class="point" style="--x:90"><span class="who">학생</span><span class="what">학생마다<br>자기 작품을 만듭니다</span></div>
  <div class="point" style="--x:1040"><span class="who">작품</span><span class="what">작품은 주소 하나로<br>바로 공유</span></div>
  <div class="point" style="--x:1990"><span class="who">교사</span><span class="what">과제 진행과<br>AI 활용 기록 확인</span></div>

  <!-- 가림 구역: 작은 글씨·브랜드만 -->
  <p class="t foot" style="--x:110;--y:1800">노트북 또는 태블릿과 인터넷으로 수업합니다</p>
  <div class="brand"><img src="../../src/assets/logo.png" alt=""><strong>렛츠코딩 라운지</strong></div>
  <p class="t url" style="--x:2110;--y:2140">lounge.letscoding.kr</p>
</template>

<script>
const only = new URLSearchParams(location.search).get('panel');
if (only) document.body.classList.add('single');
const backArt = document.getElementById('back-art');
for (const wall of document.querySelectorAll('.wall')) {
  const w = wall.dataset.wall;
  for (let i = 0; i < 3; i++) {
    if (i) wall.insertAdjacentHTML('beforeend', '<div class="post"></div>');
    const id = w + (i + 1);
    const p = document.createElement('div');
    p.className = 'panel ' + (w === 'B' ? 'back-panel' : 'side') + (only === id ? ' on' : '');
    p.innerHTML = '<div class="scene" style="--i:' + i + '"></div><span class="tag">' + id + '</span><div class="floor"></div>';
    if (w === 'B') {
      p.querySelector('.scene').classList.add('back');
      p.querySelector('.scene').append(backArt.content.cloneNode(true));
      if (i) p.querySelector('.scene').querySelectorAll('h1').forEach(h => h.setAttribute('aria-hidden', 'true'));
    }
    wall.append(p);
  }
}
</script>
</body>
</html>
