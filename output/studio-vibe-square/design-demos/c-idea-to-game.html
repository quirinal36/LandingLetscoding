<!doctype html>
<!-- Assumption: unfamiliar viewers need to see an idea become a creation. The diagonal input-to-output composition is a conceptual explanation, not a screenshot of Studio. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · 말에서 작품으로 | 렛츠코딩 스튜디오</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{min-width:500px;background:#e9edf3;color:#1b2333;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif}.poster{width:500px;height:500px;position:relative;overflow:hidden;background:#fff}.intro{height:225px;padding:27px 30px 0}.brand{font-size:16px;font-weight:750;letter-spacing:-.04em;margin:0}.headline{font-size:36px;font-weight:850;line-height:1.15;letter-spacing:-.055em;margin:24px 0 12px;word-break:keep-all}.headline span{color:#2a53b0}.descriptor{font-size:15px;font-weight:550;margin:0;color:#55607a;letter-spacing:-.025em}.scene{position:relative;height:275px;background:#3b6fe0;color:white}.input-label{position:absolute;top:23px;left:30px;font-size:12px;letter-spacing:.03em;font-weight:650}.speech{position:absolute;top:45px;left:30px;margin:0;padding:15px 18px;background:white;color:#1b2333;border-radius:17px 17px 17px 0;font-size:19px;line-height:1.3;font-weight:750;letter-spacing:-.04em;max-width:292px}.link{position:absolute;left:53px;top:110px;width:91px;height:72px;border-left:3px solid #c7daff;border-bottom:3px solid #c7daff;border-radius:0 0 0 24px}.link:after{content:'';position:absolute;right:-1px;bottom:-7px;width:13px;height:13px;transform:rotate(-45deg);border-right:3px solid #c7daff;border-bottom:3px solid #c7daff}.ai{position:absolute;left:31px;top:195px;font-size:14px;font-weight:650;line-height:1.45;letter-spacing:-.025em;color:#fff}.game{position:absolute;width:266px;height:151px;right:30px;bottom:28px;border:1px solid #cdd9ed;background:#141c29;border-radius:10px;overflow:hidden}.bar{height:30px;background:#fff;color:#1b2333;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:650}.play{color:#2a53b0}.board{position:relative;height:120px;background:#172335}.snake{position:absolute;left:72px;top:40px;display:flex;gap:2px}.snake i{display:block;width:18px;height:18px;background:#a6f1d3;border-radius:4px}.snake i:last-child{background:#e4fff3}.snake:after{content:'';position:absolute;right:0;top:20px;width:18px;height:18px;background:#a6f1d3;border-radius:4px}.food{position:absolute;left:212px;top:80px;width:13px;height:13px;background:#f48b83;border-radius:50%}.game-caption{position:absolute;right:31px;top:77px;font-size:12px;color:#fff;font-weight:650}[contenteditable=true]:focus-visible{outline:2px solid #1b2333;outline-offset:3px}h1[contenteditable=true]:focus-visible{outline-color:#3b6fe0}
</style>
</head>
<body>
<main class="poster" aria-label="렛츠코딩 스튜디오: 대화로 아이디어를 작품으로 만드는 AI 바이브코딩">
  <header class="intro">
    <p class="brand">렛츠코딩 스튜디오</p>
    <h1 class="headline" contenteditable="true" spellcheck="false" aria-label="제목 수정">AI에게 말하면,<br>내 아이디어가 <span>작품으로.</span></h1>
    <p class="descriptor" contenteditable="true" spellcheck="false" aria-label="설명 수정">대화로 만드는 AI 바이브코딩</p>
  </header>
  <section class="scene" aria-label="대화에서 게임으로 이어지는 예시">
    <span class="input-label">내가 하고 싶은 말</span>
    <p class="speech" contenteditable="true" spellcheck="false" aria-label="대화 예시 수정">스네이크 게임 만들어줘</p>
    <span class="link" aria-hidden="true"></span>
    <span class="ai">AI와 함께<br>만들고, 고치고.</span>
    <span class="game-caption">직접 해보는 나의 작품</span>
    <div class="game" role="img" aria-label="대화로 만든 스네이크 게임의 개념 예시">
      <div class="bar"><span>나의 스네이크 게임</span><span class="play">▷ 실행</span></div>
      <div class="board"><div class="snake"><i></i><i></i><i></i><i></i></div><span class="food"></span></div>
    </div>
  </section>
</main>
</body>
</html>
