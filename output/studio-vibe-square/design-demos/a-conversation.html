<!doctype html>
<!-- Assumption: a first-time viewer should understand the conversation before the term vibe coding.
     Reasoning: the large request is the visual anchor; a compact schematic game makes its result concrete.
     The chat and game are a composition concept, not a screenshot or a working AI/game. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · 대화가 먼저 보이는 스튜디오</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{min-width:500px;background:#e9edf3;font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1b2333}
.poster{width:500px;height:500px;padding:28px;background:#fff;overflow:hidden;position:relative}
.brand{margin:0;font-size:15px;line-height:20px;letter-spacing:-.03em;font-weight:750}.brand span{color:#3b6fe0}
h1{margin:19px 0 0;font-size:35px;line-height:1.18;letter-spacing:-.065em;font-weight:800;word-break:keep-all}h1 em{font-style:normal;color:#2a53b0}
.request{position:relative;margin:23px 0 0;background:#3b6fe0;color:white;padding:17px 22px 18px;border-radius:18px 18px 3px 18px;min-height:105px}
.request-label{display:block;font-size:12px;font-weight:650;line-height:16px;margin-bottom:7px;color:#fff}.request p{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.04em;font-weight:750}
.result{display:flex;align-items:center;gap:20px;margin-top:20px}.game{height:126px;width:185px;flex:none;border:1px solid #d5dbe4;border-radius:12px;overflow:hidden;background:#e9edf3}.game-bar{height:25px;background:#fff;padding:5px 10px;font-size:11px;font-weight:700;color:#55607a;letter-spacing:.02em}.field{height:100px;position:relative;background-color:#e4ebfb;background-image:linear-gradient(#cdd9f4 1px,transparent 1px),linear-gradient(90deg,#cdd9f4 1px,transparent 1px);background-size:20px 20px}.snake{position:absolute;left:40px;top:40px;display:flex;gap:2px}.snake i{display:block;width:18px;height:18px;border-radius:5px;background:#3b6fe0}.snake i:last-child{background:#1b2333}.food{position:absolute;left:140px;top:20px;width:12px;height:12px;border-radius:50%;background:#1b2333}.result-copy{flex:1}.result-copy small{font-size:12px;color:#55607a;line-height:20px}.result-copy strong{display:block;margin-top:4px;font-size:21px;line-height:1.3;letter-spacing:-.045em;font-weight:750}.result-copy p{margin:7px 0 0;font-size:14px;line-height:1.45;color:#55607a;letter-spacing:-.02em}
.footer{position:absolute;left:28px;right:28px;bottom:27px;border-top:1px solid #d5dbe4;padding-top:12px;font-size:14px;line-height:18px;color:#55607a;letter-spacing:-.025em}.footer b{color:#1b2333;font-weight:700}
[contenteditable]{outline-offset:4px;border-radius:3px}[contenteditable]:focus-visible{outline:2px dashed #1b2333}.request [contenteditable]:focus-visible{outline-color:#fff}
</style>
</head>
<body>
<main class="poster" aria-label="렛츠코딩 스튜디오 500×500 대화 중심 시안">
  <p class="brand">렛츠코딩 <span>스튜디오</span></p>
  <h1 contenteditable="true" role="textbox" aria-label="수정할 제목" aria-multiline="true" spellcheck="false">AI에게 말하면,<br>내 아이디어가 <em>작품으로.</em></h1>
  <div class="request">
    <span class="request-label">내가 만들고 싶은 건</span>
    <p contenteditable="true" role="textbox" aria-label="수정할 대화 예시" spellcheck="false">스네이크 게임 만들어줘</p>
  </div>
  <div class="result">
    <div class="game" role="img" aria-label="대화로 만드는 스네이크 게임의 개념 미리보기">
      <div class="game-bar">SNAKE GAME</div>
      <div class="field"><div class="snake"><i></i><i></i><i></i><i></i></div><span class="food"></span></div>
    </div>
    <div class="result-copy"><small>AI와 함께 만들고</small><strong>직접 해보며<br>다시 이야기해요.</strong><p>“더 빨라지게 해줘”</p></div>
  </div>
  <div class="footer">대화로 만드는 <b>AI 바이브코딩</b></div>
</main>
</body>
</html>
