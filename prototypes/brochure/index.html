<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>렛츠코딩 라운지 · 가로 A4 소개서</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9edf3; color: #1b2333; font: 16px/1.6 'Pretendard Variable', sans-serif; }
    main { max-width: 1280px; margin: auto; padding: 40px 36px 56px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .09em; color: #55607a; }
    h1 { margin: 8px 0 12px; font-size: clamp(30px, 4vw, 44px); line-height: 1.2; letter-spacing: -.035em; }
    header p { margin: 0; color: #55607a; }
    a { color: #2a53b0; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #3b6fe0; outline-offset: 4px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 22px 0 30px; }
    .links a { display: inline-flex; align-items: center; min-height: 44px; }
    .download { padding: 10px 20px; background: #2a53b0; color: white; text-decoration: none; font-weight: 650; }
    .pages { display: grid; grid-template-columns: 1fr; gap: 0; }
    figure { margin: 0; min-width: 0; }
    .pages a { display: block; }
    .pages img { display: block; width: 100%; aspect-ratio: 297 / 210; background: white; }
    figcaption { display: none; }
    figcaption span { color: #2a53b0; font-variant-numeric: tabular-nums; font-weight: 650; }
    footer { margin-top: 32px; border-top: 1px solid #c9d1df; padding-top: 20px; font-size: 14px; color: #55607a; }
    footer p { margin: 0 0 8px; }
    @media (max-width: 760px) { main { padding: 28px 12px 36px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LETSCODING LOUNGE / B · 비즈니스 제안서형</div>
      <h1>학생 한 명이, 스타트업이 됩니다.</h1>
      <p>가로 A4 · 8쪽을 한 화면에 이어서 보는 미리보기</p>
      <nav class="links" aria-label="소개서 파일">
        <a class="download" href="../../output/pdf/letscoding-lounge-brochure.pdf" download>인쇄용 PDF 다운로드</a>
        <a href="previews/final/continuous.png" download>전체 이어보기 이미지 다운로드</a>
        <a href="brochure.html" target="_blank" rel="noopener">원본 크게 보기 ↗</a>
      </nav>
    </header>

      <figure><a href="brochure.html#cover"><img src="previews/final/page-1.png" alt="소개서 1쪽: 학생 한 명이, 스타트업이 됩니다."></a><figcaption><span>01</span>표지 · 교육의 선언</figcaption></figure>
      <figure><a href="brochure.html#page2"><img src="previews/final/page-2.png" alt="소개서 2쪽: AI 시대의 교육 변화와 여섯 가지 역량"></a><figcaption><span>02</span>교육 변화 · 끝까지 만드는 힘</figcaption></figure>
      <figure><a href="brochure.html#page3"><img src="previews/final/page-3.png" alt="소개서 3쪽: 고르고, 만들고, 올리고, 설명하는 프로젝트"></a><figcaption><span>03</span>성장 과정 · 학생의 한 달</figcaption></figure>
      <figure><a href="brochure.html#page4"><img src="previews/final/page-4.png" alt="소개서 4쪽: 실제 공개 작품과 기준일이 있는 운영 수치"></a><figcaption><span>04</span>실제 활동 · 작품과 운영 수치</figcaption></figure>
      <figure><a href="brochure.html#page5"><img src="previews/final/page-5.png" alt="소개서 5쪽: 기존에 배운 코딩에서 다음 프로젝트 수업으로"></a><figcaption><span>05</span>라운지 소개 · 지금의 교육에서 확장</figcaption></figure>
      <figure><a href="brochure.html#page6"><img src="previews/final/page-6.png" alt="소개서 6쪽: 학생 아이디어와 지역사회 문제, 매달 제공되는 5개 문제"></a><figcaption><span>06</span>수업의 주제 · 매달 새로운 문제 5개</figcaption></figure>

      <figure><a href="brochure.html#page8"><img src="previews/final/page-8.png" alt="소개서 8쪽: 4주 무료, 이용료, 코칭과 상담 연락처 및 QR"></a><figcaption><span>08</span>도입 안내 · 반 하나로 시작</figcaption></figure>
    </div>
    <footer>
      <p>출력: A4 / 가로 / 실제 크기 100% / 페이지당 1쪽. 양면 출력은 짧은 쪽 넘김으로 설정해 주세요. 8쪽은 A4 4장입니다.</p>
      <p>8쪽은 인쇄용 PDF를 렌더한 미리보기입니다. <a href="design-spec.md">상세 구성</a></p>
    </footer>
  </main>

</html>
